<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.12"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#0891b2"/></marker><style>.t{font:700 38px Inter,Arial;fill:#0f172a}.st{font:400 18px Inter,Arial;fill:#64748b}.h{font:700 19px Inter,Arial;fill:#0f172a}.d{font:400 14px Inter,Arial;fill:#475569}.f{font:600 17px Inter,Arial;fill:#0e7490}.num{font:700 14px Inter,Arial;fill:#fff}</style></defs>
  <rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="12" fill="#06b6d4"/><text x="80" y="80" class="t">Internal P25 Price Benchmarking Flow</text><text x="80" y="116" class="st">A robust supplier-level comparison converts transaction history into explainable savings estimates</text>
  <path d="M330 285H385" stroke="#0891b2" stroke-width="5" marker-end="url(#a)"/><path d="M735 285H790" stroke="#0891b2" stroke-width="5" marker-end="url(#a)"/><path d="M1140 285H1195" stroke="#0891b2" stroke-width="5" marker-end="url(#a)"/>
  <path d="M1370 360V470H1140" stroke="#0891b2" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M790 555H735" stroke="#0891b2" stroke-width="5" marker-end="url(#a)"/><path d="M385 555H330" stroke="#0891b2" stroke-width="5" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="80" y="210" width="250" height="150" rx="18" fill="#fff" stroke="#cbd5e1"/></g><circle cx="108" cy="238" r="18" fill="#0f172a"/><text x="108" y="244" text-anchor="middle" class="num">1</text><text x="205" y="270" text-anchor="middle" class="h">Purchase Orders</text><text x="205" y="302" text-anchor="middle" class="d">Item · supplier · price</text><text x="205" y="326" text-anchor="middle" class="d">quantity · total</text>
  <g filter="url(#s)"><rect x="385" y="210" width="350" height="150" rx="18" fill="#fff" stroke="#67e8f9" stroke-width="2"/></g><circle cx="413" cy="238" r="18" fill="#0891b2"/><text x="413" y="244" text-anchor="middle" class="num">2</text><text x="560" y="270" text-anchor="middle" class="h">Item–Supplier Grouping</text><text x="560" y="302" text-anchor="middle" class="d">Aggregate every supplier's transactions</text><text x="560" y="326" text-anchor="middle" class="d">for each purchased item</text>
  <g filter="url(#s)"><rect x="790" y="195" width="350" height="180" rx="18" fill="#fff" stroke="#5eead4" stroke-width="2"/></g><circle cx="818" cy="223" r="18" fill="#0f766e"/><text x="818" y="229" text-anchor="middle" class="num">3</text><text x="965" y="255" text-anchor="middle" class="h">Weighted Supplier Price</text><text x="965" y="295" text-anchor="middle" class="f">Σ(unit price × quantity)</text><path d="M855 307h220" stroke="#0e7490" stroke-width="2"/><text x="965" y="337" text-anchor="middle" class="f">Σ(quantity)</text><text x="965" y="360" text-anchor="middle" class="d">one comparable price per supplier</text>
  <g filter="url(#s)"><rect x="1195" y="210" width="350" height="150" rx="18" fill="#fff" stroke="#c4b5fd" stroke-width="2"/></g><circle cx="1223" cy="238" r="18" fill="#7c3aed"/><text x="1223" y="244" text-anchor="middle" class="num">4</text><text x="1370" y="270" text-anchor="middle" class="h">Sorted Supplier Prices</text><text x="1370" y="302" text-anchor="middle" class="d">Low → high supplier-level distribution</text><text x="1370" y="326" text-anchor="middle" class="d">not individual transaction prices</text>
  <g filter="url(#s)"><rect x="790" y="470" width="350" height="170" rx="18" fill="#0f172a"/></g><circle cx="818" cy="498" r="18" fill="#22d3ee"/><text x="818" y="504" text-anchor="middle" class="num">5</text><text x="965" y="530" text-anchor="middle" style="font:700 21px Inter,Arial;fill:#fff">P25 Benchmark</text><text x="965" y="566" text-anchor="middle" style="font:400 15px Inter,Arial;fill:#cbd5e1">25th percentile of supplier prices</text><text x="965" y="594" text-anchor="middle" style="font:600 15px Inter,Arial;fill:#67e8f9">Stable internal reference price</text><text x="965" y="620" text-anchor="middle" style="font:400 13px Inter,Arial;fill:#94a3b8">with supplier and volume coverage</text>
  <g filter="url(#s)"><rect x="385" y="480" width="350" height="150" rx="18" fill="#fff" stroke="#fcd34d" stroke-width="2"/></g><circle cx="413" cy="508" r="18" fill="#d97706"/><text x="413" y="514" text-anchor="middle" class="num">6</text><text x="560" y="540" text-anchor="middle" class="h">Price Variance</text><text x="560" y="575" text-anchor="middle" class="f">(actual − P25) ÷ P25 × 100</text><text x="560" y="604" text-anchor="middle" class="d">configurable materiality threshold</text>
  <g filter="url(#s)"><rect x="80" y="480" width="250" height="150" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/></g><circle cx="108" cy="508" r="18" fill="#059669"/><text x="108" y="514" text-anchor="middle" class="num">7</text><text x="205" y="540" text-anchor="middle" class="h">Potential Savings</text><text x="205" y="575" text-anchor="middle" class="f">max(0, actual − P25)</text><text x="205" y="602" text-anchor="middle" class="f">× quantity</text>
  <rect x="490" y="710" width="620" height="80" rx="16" fill="#ecfeff" stroke="#67e8f9"/><text x="800" y="744" text-anchor="middle" class="h">Interpretation rule</text><text x="800" y="772" text-anchor="middle" class="d">Estimated savings are negotiation opportunities—not guaranteed or automatically additive outcomes.</text>
  <text x="80" y="850" class="st">Figure 5.1. Internal P25 Price Benchmarking Flow</text>
</svg>
